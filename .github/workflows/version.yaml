name: Version Worfklow

on:
  workflow_call:
    inputs:
      use-pnpm:
        description: 'Use pnpm instead of npm'
        required: false
        default: false
        type: boolean
      pnpm-version:
        description: 'The pnpm version to use. Exclude to use the packageManager version from package.json.'
        required: false
        default: ''
        type: string
      ref:
        description: 'The branch or tag name to apply version change and tag. Leave empty to use the default version from version-command'
        required: false
        default: ''
        type: string
      node-version:
        description: 'The Node.js version to use. Leave empty to use the default version.'
        required: false
        default: ''
        type: string
      node-version-file:
        description: 'Use a version file to determine Node runtime version'
        required: false
        default: ''
        type: string
      registry-url:
        description: 'The Node.js registry URL'
        required: false
        type: string
        default: ''
      scope:
        description: 'The Node.js scope'
        required: false
        type: string
        default: ''
      cache:
        description: 'The Node.js cache argument'
        required: false
        default: ''
        type: string
      version-command:
        description: 'Version bump command to run; defaults to patch version to all workspaces including root workspace.'
        required: false
        default: npm version patch --no-git-tag-version --include-workspace-root -ws
        type: string
      version-workspace:
        description: 'Workspace path to read package.json version for commit message.'
        required: false
        default: .
        type: string
      tag-includes-name:
        description: 'Include package name in the version tag?'
        required: false
        default: false
        type: boolean
      tag-version-only-prefix:
        description: 'Use a prefix like `v` for the version tag when package name excluded?'
        required: false
        default: 'v'
        type: string
    secrets:
      NODE_AUTH_TOKEN:
        required: false
    outputs:
      version:
        description: 'The new version, e.g. 1.0.3'
        value: ${{ jobs.bump_version.outputs.version }}
      tag:
        description: 'The tag that was pushed, e.g. v1.0.3 or @scope/pkg@1.0.3'
        value: ${{ jobs.bump_version.outputs.tag }}

jobs:
  bump_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}
    - name: Install pnpm
      if: ${{ inputs.use-pnpm }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        # The default self-installer shells out to `npm install`, which has been
        # observed taking 7m on a cold runner before downgrading itself to the
        # `packageManager` version. The standalone binary skips both.
        standalone: true
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
    - name: "Pull latest changes"
      run: git pull --rebase origin ${{ inputs.ref }}
    - name: 'Bump version'
      # NOTE: hacky ignore error for version command is because pnpm version doesn't support its own workspaces (passes through to npm version)
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        ${{ inputs.version-command }} --no-git-tag-version || true && git add .
      env:
        # when npm version runs, it installs and requires registry access.
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    - name: 'Read new package version'
      # NOTE: this action is a custom/public js-action that reads the package.json at a given relative path
      # and assigns its name and version to an ENV variable (used below)
      uses: iwsllc/read-package-version@v2
      with:
        workspace: ${{ inputs.version-workspace }}
    - name: 'Tag version'
      id: tag
      # Rebase BEFORE tagging: a plain pull makes a merge commit if the branch moved during the run
      # (rejected where linear history is required), and rebasing after tagging would leave the tag
      # on a commit that never reaches the branch.
      run: |
        git commit -m "feat: $PACKAGE version bump to $VER [skip ci]"
        git pull --rebase
        git tag -am "$PACKAGE $VER" "$TAG_VALUE"
        git push
        git push --tags
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG_VALUE" >> "$GITHUB_OUTPUT"
      env:
        TAG_VALUE: ${{ inputs.tag-includes-name && format('{0}@{1}', env.PACKAGE, env.VER) || format('{0}{1}',inputs.tag-version-only-prefix, env.VER) }}
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
